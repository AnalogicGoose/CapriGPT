name: CI

# Every push and every pull request. Propagation waits for this workflow to finish green,
# so it must always conclude, even for a change that needs no tests.
on:
    push:
    pull_request:
    workflow_dispatch:

# A second push to the same branch makes the first run pointless. Cancel it.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Decides whether this run has anything to test, before spending a Windows runner on it.
    # Not `paths-ignore`: a run that never starts never concludes, and the cascade would stop.
    guard:
        name: Decide what to test
        runs-on: ubuntu-latest
        outputs:
            test: ${{ steps.paths.outputs.test }}
        steps:
            -   uses: actions/checkout@v4
                with:
                    fetch-depth: 0
            -   name: See which files changed
                id: paths
                env:
                    EVENT: ${{ github.event_name }}
                    BEFORE: ${{ github.event.before }}
                    BASE_REF: ${{ github.base_ref }}
                run: |
                    set -euo pipefail
                    BASE=""
                    if [ "$EVENT" = "pull_request" ]; then
                      BASE=$(git merge-base "origin/$BASE_REF" HEAD || true)
                    elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] \
                         && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                      BASE="$BEFORE"
                    fi
                    # A new branch, a forced push or a manual run has no trustworthy base: test.
                    if [ -z "$BASE" ]; then echo "test=true" >> "$GITHUB_OUTPUT"; exit 0; fi
                    # Documentation cannot break a build. Anything else is tested.
                    if git diff --name-only "$BASE" HEAD | grep -qvE '^docs/|\.md$'; then
                      echo "test=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "test=false" >> "$GITHUB_OUTPUT"
                      echo "Documentation only. Nothing to test."
                    fi

    test:
        name: Unit tests (Windows)
        needs: guard
        if: needs.guard.outputs.test == 'true'
        # The native Win32 bindings and app discovery are tested against the real API.
        runs-on: windows-latest
        env:
            # Unit tests never load Electron; the smoke tests that do stay a local check.
            ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-node@v4
                with:
                    node-version: '24'
                    cache: npm
            -   run: npm ci --no-audit --no-fund
            -   run: npm test
